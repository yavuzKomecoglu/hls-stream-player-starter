<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS Stream Player</title>
  <style>
    body { margin: 0; background: #111827; color: white;
           font: 28px sans-serif; padding: 64px; }
    button { font-size: 28px; padding: 16px 26px; margin-right: 16px; }
    button:focus { outline: 5px solid #60a5fa; }
    video { width: 960px; height: 540px; margin-top: 32px; background: black; }
  </style>
</head>
<body>
  <h1>HLS Stream Player</h1>
  <button id="play">Test Yayınını Oynat</button>
  <button id="stop">Durdur</button>
  <p id="result">Sağ/sol tuşlarıyla gezinip OK'a basın.</p>
  <video id="video"></video>

  <script>
    // Eski Chromium sürümlerinde (ör. 2018 modelleri, Chromium 53) derleme
    // adımı olmadan çalışsın diye bilerek var ve function kullanıldı.
    var TEST_STREAM = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
    var buttons = [document.getElementById('play'), document.getElementById('stop')];
    var video = document.getElementById('video');
    var result = document.getElementById('result');

    function stop() {
      video.pause();
      video.removeAttribute('src');
      video.load();
      result.textContent = 'Durduruldu.';
    }

    buttons[0].onclick = function () {
      video.src = TEST_STREAM;
      video.play();
      result.textContent = 'Oynatılıyor...';
    };
    buttons[1].onclick = stop;

    document.addEventListener('keydown', function (e) {
      var index = buttons.indexOf(document.activeElement);
      if (index < 0) index = 0;
      if (e.keyCode === 39) buttons[Math.min(index + 1, buttons.length - 1)].focus(); // sağ
      if (e.keyCode === 37) buttons[Math.max(index - 1, 0)].focus();                  // sol
      if (e.keyCode === 461) stop();                                                  // Back
    });

    // autofocus bazı TV tarayıcılarında çalışmıyor; odağı elle veriyoruz.
    window.onload = function () { buttons[0].focus(); };
  </script>
</body>
</html>
