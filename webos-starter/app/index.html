<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>HLS Player</title>
  <style>
    body { margin: 0; padding: 60px; background: #111827;
           color: #fff; font: 28px sans-serif; }
    button { padding: 16px 28px; margin-right: 12px; border: 0;
             border-radius: 10px; font-size: 26px;
             background: #1f2937; color: #fff; }
    button:focus { outline: 4px solid #60a5fa; background: #2563eb; }
    video { display: block; width: 960px; height: 540px;
            margin-top: 32px; background: #000; }
    .hint { color: #9ca3af; font-size: 22px; }
  </style>
</head>
<body>
  <h1>HLS Stream Player</h1>
  <p class="hint">← → seç · OK başlat · Back durdur</p>
  <button id="play">Yayını Başlat</button>
  <button id="stop">Durdur</button>
  <video id="player"></video>

  <script>
    var STREAM = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
    var video = document.getElementById('player');
    var buttons = [
      document.getElementById('play'),
      document.getElementById('stop')
    ];

    function play() {
      video.src = STREAM;
      video.play();
    }

    function stop() {
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    buttons[0].onclick = play;
    buttons[1].onclick = stop;
    buttons[0].focus();

    document.addEventListener('keydown', function (e) {
      var i = buttons.indexOf(document.activeElement);
      if (e.keyCode === 37) buttons[Math.max(i - 1, 0)].focus();
      if (e.keyCode === 39) buttons[Math.min(i + 1, 1)].focus();
      if (e.keyCode === 461) stop();
    });
  </script>
</body>
</html>
